[project]
name = "agenticops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-groq",
    "typing-extensions>=4.5.0", # helpful for TypedDict compatibility across Python version
    "streamlit>=1.62.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.11.1",
    "langchain-community>=0.4.2",
    "langchain-huggingface",
    "langchain-qdrant",
    "pypdf",
    "sentence-transformers",
    "arxiv>=2,<3",
    "wikipedia>=1.4.0",
    "tavily-python>=0.8.0",
    "langchain-text-splitters>=1.1.2",
]

[project.scripts]
agenticops = "agenticops:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
